<div
  class="w-full max-w-7xl mx-auto min-h-screen flex-1 flex items-center justify-center gap-10 flex-col"
>
  <div
    class="w-full max-w-3xl h-full secondary-background py-12 px-6 rounded-md shadow"
  >
    <h1 class="title text-center mb-2">Alterar senha</h1>
    <p class="description text-center">
      Digite sua nova senha e confirme para alterar a senha da sua conta.
    </p>

    <form
      [formGroup]="changePassword"
      (ngSubmit)="onSubmit()"
      class="w-full flex flex-col gap-2 mt-6"
    >
      <div class="w-full max-w-md mx-auto flex flex-col gap-2">
        <app-input-password
          [id]="'password'"
          [label]="'Senha'"
          [required]="true"
          [fluid]="true"
          [maxlength]="18"
          [control]="password"
          [feedback]="true"
          class="w-full"
        ></app-input-password>

        <app-input-password
          [id]="'confirmPassword'"
          [label]="'Confirmar senha'"
          [required]="true"
          [fluid]="true"
          [maxlength]="18"
          [control]="confirmPassword"
          [feedback]="false"
          class="w-full"
        ></app-input-password>
      </div>

      <app-button
        class="w-full max-w-96 mt-6 mx-auto"
        [label]="'Alterar senha'"
        [type]="'submit'"
        [fluid]="true"
        [severity]="'primary'"
        [loading]="loading"
      ></app-button>
    </form>
  </div>
</div>
