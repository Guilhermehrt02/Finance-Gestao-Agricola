<header class="w-full h-14 flex items-center justify-end gap-6 px-10">
  <app-button
    [variant]="'text'"
    [severity]="'secondary'"
    [icon]="'pi pi-fw pi-bars'"
    class="mr-auto xl:hidden"
    (click)="menuToggle()"
  ></app-button>

  <div class="flex items-center justify-center gap-4">
    <div class="flex flex-col items-end">
      <p class="text">{{ user?.firstName }}</p>
      <p class="description primary">{{ user?.role }}</p>
    </div>

    <button class="rounded-full" (click)="avatarMenu.toggle($event)">
      <app-avatar [icon]="'pi pi-fw pi-user'"></app-avatar>
    </button>
  </div>
</header>

<app-menu #avatarMenu [items]="avatarItems" [popup]="true"></app-menu>
