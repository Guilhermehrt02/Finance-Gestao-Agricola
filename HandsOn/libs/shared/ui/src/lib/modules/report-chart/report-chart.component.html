<div class="">
  <label
    *ngIf="label && label.length > 0"
    for="chart"
    class="text-white text-lg font-semibold"
  >
    {{ label }}
  </label>

  <div [ngClass]="className" class="w-full h-full">
    <ng-container *ngIf="hasData(); else noDataTemplate">
      <p-chart
        id="chart"
        [type]="type"
        [data]="data"
        [options]="options"
        [responsive]="true"
        *ngIf="!loading"
        styleClass="w-full h-full"
      ></p-chart>
    </ng-container>

    <ng-template #noDataTemplate>
      <p *ngIf="!loading" class="text-center text-sm text-gray-400">
        Nenhum dado disponível para exibir.
      </p>
    </ng-template>

    <p *ngIf="loading" class="text-center text-sm text-gray-400">
      Carregando gráfico...
    </p>
  </div>
</div>
