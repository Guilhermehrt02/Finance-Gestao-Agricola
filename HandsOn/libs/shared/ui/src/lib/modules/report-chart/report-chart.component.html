<div class="w-full flex flex-col gap-2"> <!--"w-full max-w-md mx-auto flex flex-col gap-2"-->
    <label *ngIf="label && label.length > 0" for="chart">{{ label }}</label>
  
    <div [ngClass]="className">
      <p-chart
        id="chart"
        [type]="type"
        [data]="data"
        [options]="options"
        [responsive]="true"
        *ngIf="!loading"
      ></p-chart>
  
      <p *ngIf="loading" class="text-center text-sm text-gray-500">
        Carregando gráfico...
      </p>
    </div>
  </div>
