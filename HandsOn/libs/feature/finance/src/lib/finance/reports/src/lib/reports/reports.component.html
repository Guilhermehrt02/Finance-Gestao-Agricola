<div class="p-6 space-y-6">

  <div class="flex justify-end mb-4">
    <lib-date-range-filter
      (dateRangeChange)="onSubmit($event)"
    ></lib-date-range-filter>
  </div>
  
  <lib-report-summary
    [totalBalance]="totalBalance"
    [totalRevenues]="totalRevenues"
    [totalExpenses]="totalExpenses"
    [loading]="loading"
  ></lib-report-summary>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <div class=" p-5 rounded-2xl shadow-md border-4 border-green-800">
      <h2 class="text-white text-lg font-semibold mb-4">
        Despesas por categoria
      </h2>
      <div class="w-96 mx-auto ">
        <lib-report-chart
          [type]="'doughnut'"
          [data]="expenseChartData"
          [loading]="loading"
        ></lib-report-chart>
      </div>
    </div>

    <div class="p-5 rounded-2xl shadow-md border-4 border-green-800">
      <h2 class="text-white text-lg font-semibold">
        Receitas por categoria
      </h2>
      <div class="w-96 mx-auto">
        <lib-report-chart
        [type]="'doughnut'"
        [data]="revenueChartData"
        [loading]="loading"
        ></lib-report-chart>
      </div>
    </div>

    <div class="md:col-span-2 p-5 rounded-2xl shadow-md border-4 border-green-800">
      <h2 class="text-white text-lg font-semibold mb-4">Saldo por período</h2>
      <lib-report-chart
        [type]="'bar'"
        [data]="barChartData"
        [loading]="loading"
        [options]="{ responsive: true }"
      ></lib-report-chart>
    </div>
  </div>
</div>
