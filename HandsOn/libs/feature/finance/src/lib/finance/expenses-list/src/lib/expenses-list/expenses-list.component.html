
<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">Minhas Despesas</h2>
    <lib-button
      [label]="'Nova Despesa'"
      [severity]="'primary'"
      [type]="'button'"
      (click)="onCreate()"
    ></lib-button>
  </div>

  <lib-table
  [data]="data"
  [columns]="columns"
  [loading]="loading"
  [showMoreButton]="showMoreButton"
  (refresh)="refresh()"
  />
</div>
